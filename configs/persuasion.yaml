# Study 2: do notes from other agents make a monitor more lenient on backdoors?
# Items come from Study 1's stage files; Study 1 results are only read, never written.
study: persuasion
run_name: persuasion
source_stages: results/study/stages
models:
  A:
    name: ollama/qwen2.5-coder:7b
  B:
    name: ollama/llama3.1:8b
  # Large monitors on Groq's free tier (ids and limits read from console.groq.com,
  # 7 Nov 2026: 30 requests/min, 1K requests/day, 8K tokens/min, 200K tokens/day each).
  # Both are reasoning models: low reasoning effort and room for the answer after it.
  # Key from the GROQ_API_KEY environment variable only.
  L1:
    name: groq/openai/gpt-oss-120b
    max_connections: 1
    max_retries: 8
    max_tokens: 1024
    reasoning_effort: low
  L2:
    name: groq/qwen/qwen3.8-27b
    max_connections: 1
    max_retries: 8
    max_tokens: 1024
    reasoning_effort: low
  # Larger models on Alibaba Cloud Model Studio's free quota (1M tokens per model,
  # read from the console, 7 Nov 2026). Turn on "Stop-on-Exhaust" for these models in
  # the console first, so nothing can be billed. Key from DASHSCOPE_API_KEY only.
  # Check the base URL against your region in the console (international endpoint below).
  L3:
    name: openai-api/dashscope/qwen3.8-max-0902
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    max_connections: 2
    max_retries: 8
    max_tokens: 1024
  L4:
    name: openai-api/dashscope/kimi-k3.1-pro
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    max_connections: 2
    max_retries: 8
    max_tokens: 1024
note_author: A                # one fixed model writes every note
monitors: [A, B]              # L1 / L2 are run one at a time with --monitor (see README)
large_monitors: [L1, L2, L3, L4]  # the group compared with A and B in H7
conditions: [C0, E1, E3, E5, E3A, N3]
seed: 1234
temperature: 0.0
max_tokens_note: 120
max_tokens_monitor: 160
max_connections: 1            # Ollama serves one request at a time by default
sample_time_limit: 600
allow_free_tier_api: true     # free API tiers only; keys from environment variables
allow_paid: false             # hard budget rule: never set true
results_dir: results
log_dir: logs
cache_dir: .cache/inspect
