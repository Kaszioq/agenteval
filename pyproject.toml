[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Evaluations of LLM agents for safety failures. Study 1: self-recognition and leniency in code monitors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.283",
    "openai>=2.45",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "black>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agenteval = "agenteval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenteval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
